<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>微记 MiniFeed · 记录此刻</title>
  <meta name="description" content="微记 MiniFeed —— 一个轻量的本地短动态记录工具，数据仅保存在当前浏览器。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234F46E5'/%3E%3Ctext x='32' y='44' font-size='34' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E%E5%BE%AE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
  </div>

  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">微</div>
        <div class="brand-text">
          <h1 class="brand-name">微记</h1>
          <p class="brand-sub">MiniFeed · 记录此刻</p>
        </div>
      </div>
      <span class="badge" title="所有内容都保存在当前浏览器，不会上传服务器">
        <span class="badge-dot" aria-hidden="true"></span>
        本地存储
      </span>
    </header>

    <main>
      <section class="composer card" aria-labelledby="composer-heading">
        <h2 id="composer-heading" class="sr-only">发布新内容</h2>
        <form id="post-form" class="composer-form">
          <div class="composer-avatar" aria-hidden="true">我</div>
          <div class="composer-body">
            <label class="sr-only" for="post-input">写下此刻的想法</label>
            <textarea
              id="post-input"
              class="composer-input"
              name="content"
              rows="3"
              maxlength="280"
              placeholder="此刻在想些什么？"
              autocomplete="off"
            ></textarea>
            <div class="composer-footer">
              <div class="composer-meta">
                <span id="counter" class="counter">0/280</span>
                <span class="hint">Ctrl / ⌘ + Enter 快速发布</span>
              </div>
              <button id="submit-btn" class="btn-primary" type="submit" disabled>发布</button>
            </div>
          </div>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="timeline" aria-labelledby="timeline-heading">
        <div class="section-head">
          <h2 id="timeline-heading">时间线</h2>
          <span id="post-count" class="count">0 条记录</span>
        </div>

        <ul id="post-list" class="post-list"></ul>

        <div id="empty-state" class="empty card" hidden>
          <svg class="empty-art" viewBox="0 0 120 96" role="img" aria-label="空记录插画">
            <defs>
              <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#EEF1FB" />
                <stop offset="100%" stop-color="#E0E7FF" />
              </linearGradient>
              <linearGradient id="bubbleGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#6366F1" />
                <stop offset="100%" stop-color="#8B5CF6" />
              </linearGradient>
            </defs>
            <rect x="18" y="14" width="60" height="72" rx="10" fill="url(#paperGrad)" stroke="#D8DEF5" />
            <rect x="30" y="30" width="34" height="4" rx="2" fill="#C7D2FE" />
            <rect x="30" y="42" width="26" height="4" rx="2" fill="#D8DEF5" />
            <rect x="30" y="54" width="30" height="4" rx="2" fill="#D8DEF5" />
            <path d="M62 46h30a8 8 0 0 1 8 8v18a8 8 0 0 1-8 8h-8l-9 9v-9h-13a8 8 0 0 1-8-8V54a8 8 0 0 1 8-8Z" fill="url(#bubbleGrad)" opacity="0.9" />
            <circle cx="71" cy="63" r="3" fill="#fff" />
            <circle cx="80" cy="63" r="3" fill="#fff" opacity="0.8" />
            <circle cx="89" cy="63" r="3" fill="#fff" opacity="0.6" />
          </svg>
          <p class="empty-title">还没有任何记录</p>
          <p class="empty-desc">写下第一条想法，它会保存在这台设备的浏览器里。</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>数据仅存储于本地浏览器，清除浏览器数据将丢失内容。</p>
      <p class="version">微记 MiniFeed · v1.0.0</p>
    </footer>
  </div>

  <template id="post-template">
    <li class="post card">
      <div class="post-avatar" aria-hidden="true">我</div>
      <div class="post-main">
        <div class="post-head">
          <span class="post-author">我</span>
          <time class="post-time"></time>
        </div>
        <p class="post-text"></p>
      </div>
    </li>
  </template>

  <script src="./js/app.js"></script>
</body>
</html>
